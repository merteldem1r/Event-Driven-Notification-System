# Local development stack.
#   Whole system:          make up         (api + worker + fake provider + postgres + redis + migrations)
#   Only infrastructure:   make infra-up   (postgres + redis + migrations)
#   More workers:          docker compose up -d --scale worker=3
#
# The worker sends to the local fake provider by default (D9). To send to webhook.site instead,
# set PROVIDER_URL in your shell or in a .env file next to this file (gitignored):
#   PROVIDER_URL=https://webhook.site/<your-id>
#
# Credentials here are for local development only.

name: notification-system

services:
  api:
    build: . # built from our Dockerfile
    ports:
      - "8080:8080" # your Mac:8080 -> container:8080
    environment:
      HTTP_PORT: "8080"
      LOG_LEVEL: info
      # Inside the Compose network the database is reached by service name.
      DATABASE_URL: postgres://notification:notification@postgres:5432/notification?sslmode=disable
    depends_on:
      # Start the API only after both are actually ready, not just started.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Takes notifications from the queue and sends them. Same image as the API, other program.
  worker:
    build: .
    entrypoint: ["/worker"]
    # /health and /metrics. A range, so scaled workers each get a port on your Mac; which one
    # can change on restart, so look it up: docker compose port worker 8081 (--index 2 for the 2nd)
    ports:
      - "8081-8089:8081"
    environment:
      LOG_LEVEL: info
      WORKER_HTTP_PORT: "8081"
      DATABASE_URL: postgres://notification:notification@postgres:5432/notification?sslmode=disable
      REDIS_URL: redis://redis:6379/0 # shared rate limit: 85/s per channel by default, under the provider's 100 (D17)
      # Empty unless set in the shell or .env: then the defaults in internal/config apply.
      RATE_LIMIT_PER_SECOND: ${RATE_LIMIT_PER_SECOND:-}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-}
      RETRY_BASE_DELAY: ${RETRY_BASE_DELAY:-}
      RETRY_MAX_DELAY: ${RETRY_MAX_DELAY:-}
      # The fake provider unless PROVIDER_URL is set (shell or .env).
      PROVIDER_URL: ${PROVIDER_URL:-http://fakeprovider:9090/}
    # docker stop sends SIGTERM and kills after this long. Longer than WORKER_SHUTDOWN_TIMEOUT (25s),
    # so in-flight sends can finish (the 10s default would cut them off).
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      fakeprovider:
        condition: service_started # no health check: the image has no shell or curl

  # Local stand-in for the external provider (D9): answers like webhook.site, logs how many
  # messages per channel it received each second. Delay and failure rate from the shell or .env.
  fakeprovider:
    build: .
    entrypoint: ["/fakeprovider"]
    ports:
      - "127.0.0.1:9090:9090" # also reachable from your Mac, e.g. for make run-worker
    environment:
      FAKE_PROVIDER_PORT: "9090"
      FAKE_PROVIDER_LATENCY: ${FAKE_PROVIDER_LATENCY:-50ms}
      FAKE_PROVIDER_FAILURE_RATE: ${FAKE_PROVIDER_FAILURE_RATE:-0}

  # One-off job: applies pending migrations, then exits.
  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://notification:notification@postgres:5432/notification?sslmode=disable
    command: ["up"] # override with e.g. `docker compose run --rm migrate down 1`
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
      POSTGRES_DB: notification
    ports:
      # 5433 on your Mac, because a local PostgreSQL may already use 5432.
      # Containers still reach it as postgres:5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data # keeps data across restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notification"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
