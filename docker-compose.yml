# Local development stack.
#   Whole system:          make up
#   Only infrastructure:   make infra-up   (postgres + redis + migrations)
#
# Credentials here are for local development only.

name: notification-system

services:
  api:
    build: . # built from our Dockerfile
    ports:
      - "8080:8080" # your Mac:8080 -> container:8080
    environment:
      HTTP_PORT: "8080"
      LOG_LEVEL: info
      # Inside the Compose network the database is reached by service name.
      DATABASE_URL: postgres://notification:notification@postgres:5432/notification?sslmode=disable
    depends_on:
      # Start the API only after both are actually ready, not just started.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # One-off job: applies pending migrations, then exits.
  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://notification:notification@postgres:5432/notification?sslmode=disable
    command: ["up"] # override with e.g. `docker compose run --rm migrate down 1`
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
      POSTGRES_DB: notification
    ports:
      # 5433 on your Mac, because a local PostgreSQL may already use 5432.
      # Containers still reach it as postgres:5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data # keeps data across restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notification"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
