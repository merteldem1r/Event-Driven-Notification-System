# golangci-lint configuration (v2 format).
# Run locally with `make lint`; CI runs the same version (.github/workflows/ci.yml).
version: "2"

linters:
  # The default set: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - bodyclose # HTTP response bodies must be closed (provider client)
    - errorlint # use errors.Is/As and %w correctly with wrapped errors
    - gosec # common security mistakes
    - misspell # spelling mistakes in comments and strings
    - noctx # outgoing HTTP requests must carry a context (cancellation, timeouts)
    - unconvert # unnecessary type conversions

formatters:
  enable:
    - gofmt
    - goimports # gofmt + import grouping and cleanup
