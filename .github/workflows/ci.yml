name: CI

# On every push and pull request: the checks of `make check`, a vulnerability scan, the
# migrations both ways, an end-to-end smoke test, and the Docker image. On main, once every
# check has passed, the image is published to GitHub Container Registry (D23).

on:
  push:
  pull_request:

permissions:
  contents: read # jobs only read the code; the image job asks for more itself

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # use the Go version declared in go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0 # keep in sync with GOLANGCI_LINT_VERSION in the Makefile

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test (with race detector)
        run: go test -race ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        # Fails only for vulnerabilities our code can actually reach.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./... # keep in sync with GOVULNCHECK_VERSION in the Makefile

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine # same as docker-compose.yml
        env:
          POSTGRES_USER: notification
          POSTGRES_PASSWORD: notification
          POSTGRES_DB: notification
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U notification" --health-interval 2s --health-retries 15
    env:
      DB: postgres://notification:notification@localhost:5432/notification?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      # The tests only ever migrate up; this proves every down file works and that up runs again after it.
      - name: Up, down, up
        run: |
          migrate() { docker run --rm --network host -v "$PWD/migrations:/migrations" migrate/migrate:v4.18.3 -path /migrations -database "$DB" "$@"; }
          migrate up
          migrate down -all
          migrate up

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack and send one notification end to end
        run: make smoke
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

  image:
    needs: [lint, test, vulncheck, migrations, smoke] # nothing is published unless every check passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # to push to ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # short-lived token GitHub gives this run; no secret to manage
      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }} # lowercased by the action, as the registry requires
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build, and push on main
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }} # links the image to this repository
          cache-from: type=gha
          cache-to: type=gha,mode=max
